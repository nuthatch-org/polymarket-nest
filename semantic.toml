[view.fills]
description = "One row per OrderFilled across the three exchanges. A match emits one row per maker order and one for the taker order (is_taker_order, where taker is the exchange itself). collateral is pUSD and shares are outcome tokens, both raw units with 6 decimals. token_id is a full-width uint256 kept as text."

[view.matches]
description = "One row per OrdersMatched: a taker order and what it filled, from the taker's side. Count trades and volume here, not in fills, which carries both sides of each match."

[view.volume_hourly]
description = "Matched taker orders and collateral (raw pUSD units, 6 decimals) per venue and hour. hour is the unix time the hour starts."
